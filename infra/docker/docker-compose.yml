services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_video_editor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ../../backend
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      DATABASE_URL: DATABASE_URL=postgresql+pg8000://postgres:postgres@127.0.0.1:5433/ai_video_editor
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: admin12345
    depends_on:
      - postgres
      - minio
    volumes:
      - ../../backend:/app

volumes:
  postgres_data:
  minio_data:
